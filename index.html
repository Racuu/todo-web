function dayKey(y,m,d){
  const date=new Date(y,m-1,d,12);
  return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
}
function shiftDate(key,days){const [y,m,d]=key.split('-').map(Number);return dayKey(y,m,d+days)}
function weekday(key){return new Date(key+'T12:00:00').getDay()}
function weekdayName(key){return '周'+'日一二三四五六'[weekday(key)]}
function dateCaption(key){const [,m,d]=key.split('-').map(Number);return m+'月'+d+'日, '+weekdayName(key)}
function nextMonday(base){return shiftDate(base,8-(weekday(base)||7))}
function plannedBuckets(base){
  const next=shiftDate(base,1),start=shiftDate(base,2),end=shiftDate(base,6);
  return [
    {id:'prior',title:'先前',accept:d=>d<base},
    {id:'today',title:'今天',accept:d=>d===base},
    {id:'tomorrow',title:'明天',accept:d=>d===next},
    {id:'range',title:dateCaption(start)+' 到 '+dateCaption(end),accept:d=>d>=start&&d<=end},
    {id:'later',title:'稍后',accept:d=>d>end}
  ];
}

function nextDue(task,base=today()){
  const initial=task.due||base,[ay,am,ad]=(task.repeatAnchor||initial).split('-').map(Number);
  const threshold=initial>base?initial:base;
  const [y,m]=threshold.split('-').map(Number);
  const clampDate=(year,month)=>dayKey(year,month,Math.min(ad,new Date(year,month,0,12).getDate()));
  if(task.repeat==='monthly'){const candidate=clampDate(y,m);return candidate>threshold?candidate:clampDate(y,m+1)}
  if(task.repeat==='yearly'){const candidate=clampDate(y,am);return candidate>threshold?candidate:clampDate(y+1,am)}
  let next=shiftDate(threshold,1);
  if(task.repeat==='weekdays')while([0,6].includes(weekday(next)))next=shiftDate(next,1);
  if(task.repeat==='weekly')while(weekday(next)!==weekday(initial))next=shiftDate(next,1);
  return next;
}
// One fast-forward commit keeps the completed occurrence and the next due task together.
async function commitChanges(changes,message,scope,parents=[]){
  await verifyPrivate();
  const ref='/git/ref/heads/'+branch.split('/').map(encodeURIComponent).join('/');
  const head=(await api(ref)).object.sha,base=(await api('/git/commits/'+head)).tree.sha;
  const snapshot=await api('/git/trees/'+base+'?recursive=1');
  if(snapshot.truncated)throw Error('任务库太大，无法确认版本。');
  const versions=new Map(snapshot.tree.map(item=>[item.path,item.sha]));
  for(const item of changes)if(versions.get(item.path)!==item.expected)throw Error('任务已更新，请刷新后再试。');
  for(const p of parents){
    const r=records.get(p);
    if(!r||r.data.deleted||r.sha!==versions.get(p))throw Error('目标组或清单已改变，请刷新后重试。');
  }
  if(scope){
    const remote=await loadRecords(base);
    const sameMembers=(map,other)=>[...map].every(([p,r])=>!scope(p,r.data)||other.get(p)?.sha===r.sha);
    if(!sameMembers(remote,records)||!sameMembers(records,remote))throw Error('组或清单的内容已改变，请刷新后重试。');
  }
  const post=(path,body,method='POST')=>api(path,{method,body:JSON.stringify(body)});
  const tree=await post('/git/trees',{base_tree:base,tree:changes.map(item=>({path:item.path,mode:'100644',type:'blob',content:JSON.stringify(item.data,null,2)}))});
  const commit=await post('/git/commits',{tree:tree.sha,parents:[head],message});
  await post(ref.replace('/git/ref/','/git/refs/'),{sha:commit.sha,force:false},'PATCH');
  const changed=new Map(tree.tree.map(item=>[item.path,item.sha]));
  // Tree creation may return only the root entries for nested paths.
  if(changes.every(c=>changed.has(c.path))){for(const c of changes)records.set(c.path,{data:c.data,sha:changed.get(c.path)})}
  else records=await loadRecords();
  scheduleSnapshot();
}
async function completeRepeating(record){
  const original=record.data,path=taskKey(original.id),due=nextDue(original);
  const next={...original,due,repeatAnchor:original.repeatAnchor||original.due||today(),day:'',steps:original.steps.map(s=>({...s,done:false}))};
  const history={...original,id:crypto.randomUUID(),done:true,repeat:'',repeatAnchor:''};
  const past=taskKey(history.id);
  await commitChanges([{path,expected:record.sha,data:next},{path:past,expected:undefined,data:history}],'完成重复任务并安排下一次');
  const nextSha=records.get(path)?.sha,pastSha=records.get(past)?.sha;
  if(editing?.id===original.id)mountEditor(records.get(path));
  notifyAction('已完成本次，下次 '+due,()=>change(async()=>{
    await commitChanges([{path,expected:nextSha,data:original},{path:past,expected:pastSha,data:{...history,deleted:true}}],'撤销完成重复任务');
    if(editing?.id===original.id)mountEditor(records.get(path));
  }));
}

async function updateTask(id,patch,undoLabel){
  if(!await finishEdit())return;
  const key=taskKey(id),current=records.get(key);
  if(!current)return;
  if(patch.done===true&&!current.data.done&&repeatNames[current.data.repeat])return change(()=>completeRepeating(current));
  if('due' in patch && current.data.repeat && !('repeatAnchor' in patch))patch={...patch,repeatAnchor:patch.due};
  const old=Object.fromEntries(Object.keys(patch).map(k=>[k,current.data[k]]));
  await change(async()=>{
    await storeFile(key,{...current.data,...patch},current.sha);
    if(editing?.id===id){if(patch.deleted)closeDetail();else mountEditor(records.get(key))}
    if(undoLabel)notifyAction(undoLabel,async()=>{
      const now=records.get(key);
      if(!now||Object.keys(patch).some(k=>now.data[k]!==patch[k])){notifyAction('任务状态已改变');return}
      await updateTask(id,old);
    });
  });
}

function runTaskAction(id,action){

    case 'star':return updateTask(id,{star:!t.star});

function compareTasks(mode){
  const day=today();
  return (a,b)=>{
    let n=0;
    if(mode==='star')n=Number(b.star)-Number(a.star);
    if(mode==='due')n=(a.due||'9999-99-99').localeCompare(b.due||'9999-99-99');
    if(mode==='day')n=Number(b.day===day)-Number(a.day===day);
    if(mode==='name')n=a.title.localeCompare(b.title,'zh-CN',{numeric:true});
    return n||b.created-a.created||a.id.localeCompare(b.id);
  };
}

    return Error('GitHub 请求已限流。'+(time?'请在 '+new Date(time).toLocaleTimeString()+' 后重试。':'请稍后再试。'));

  return Error('GitHub 拒绝读取（'+response.status+'）。'+(detail.message||'请检查令牌的仓库访问权限。'));

async function loadRecords(treeRef=branch){
  const tree=await api('/git/trees/'+encodeURIComponent(treeRef)+'?recursive=1');
  if(tree.truncated)throw Error('仓库文件过多，无法完整载入。');
  const files=tree.tree.filter(f=>f.type==='blob'&&/^(groups|lists|tasks)\/[a-f\d-]{36}\.json$/.test(f.path));
  const next=new Map(),missing=[];
  for(const f of files){
    const old=records.get(f.path);
    if(old?.sha===f.sha)next.set(f.path,old);else missing.push(f);
  }
  function add(f,data){
    if(f.path!==f.path.split('/')[0]+'/'+data.id+'.json')throw Error('任务文件格式无效');
    next.set(f.path,{sha:f.sha,data});
  }
  if(!missing.length&&next.size===records.size)return records;
  if(missing.length<8){
    for(const f of missing)add(f,decode((await api('/git/blobs/'+f.sha)).content));
    return next;
  }
  const [owner,name]=config.repo.split('/');
  for(let i=0;i<missing.length;i+=50){
    const batch=missing.slice(i,i+50);
    const fields=batch.map((f,j)=>{
      if(!/^[0-9a-f]{40}$/.test(f.sha))throw Error('文件版本无效');
      return 'b'+j+':object(oid:"'+f.sha+'"){... on Blob{text isTruncated}}';
    }).join(' ');
    const query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){'+fields+'}}';
    const response=await fetch('https://api.github.com/graphql',{method:'POST',redirect:'error',
      headers:{Authorization:'Bearer '+config.token,'Content-Type':'application/json'},
      body:JSON.stringify({query,variables:{owner,name}})});
    if(!response.ok)throw await githubError(response);
    const result=await response.json();
    if(result.errors?.length)throw Error('批量读取失败：'+result.errors[0].message);
    for(const [j,f] of batch.entries()){
      const blob=result.data?.repository?.['b'+j];
      if(!blob||blob.isTruncated||typeof blob.text!=='string'){
        add(f,decode((await api('/git/blobs/'+f.sha)).content));
      }else add(f,JSON.parse(blob.text));
    }
    status('正在读取 '+next.size+' / '+files.length);
  }
  return next;
}

function makeBackup(map) {

  return {format:backupFormat, version:2, exportedAt:new Date().toISOString(),
    fields:{groups:'Each group has an id and name. Ungrouped groups and deleted lists can carry deleted=true.',lists:'group references groups.id; empty or absent means ungrouped. sort is star, due, day, name, or created (default). Empty groups and lists are retained.',
      tasks:'list references lists.id. An empty list identifies an unassigned task from an older version. day and due are local YYYY-MM-DD dates. created is Unix milliseconds. done, star, deleted and steps[].done are booleans. Optional repeat: daily, weekdays, weekly, monthly, yearly. repeatAnchor is the calendar reference date.',
      restore:'Write groups, lists and tasks as UTF-8 JSON in groups/{id}.json, lists/{id}.json and tasks/{id}.json in an initialized private data repo. Retain IDs and list links. Independent programs can read the arrays directly.'},
    groups:pick('groups/'), lists:pick('lists/'), tasks:pick('tasks/')};

function readBackup(data) {

    add(groupKey(g.id),g);

  for(const l of data.lists){
    if(l?.group&&!map.has(groupKey(l.group)))throw Error('有清单引用了缺失的组。');
    if(l?.sort&&!Object.hasOwn(sortLabels,l.sort))throw Error('清单排序无效。');
    if(!l||!uuid.test(l.id)||!text(l.name)||!l.name.trim())throw Error('清单名称或编号无效。');
    add(listKey(l.id),l);
  }

function csvData(data) {

  const header=['任务编号','清单编号','清单','任务','状态','重要','我的一天','截止日期','创建时间','备注','步骤（JSON）','已删除','重复','重复基准日','组编号','组'];

async function restoreMissing(){

      else if(JSON.stringify(remote.get(path).data)===JSON.stringify(data))skipped++;
