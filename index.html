function dayKey(y,m,d){

    {id:'today',title:'今天',accept:d=>d===base},
    {id:'tomorrow',title:'明天',accept:d=>d===next},
    {id:'range',title:dateCaption(start)+' 到 '+dateCaption(end),accept:d=>d>=start&&d<=end},

function nextDue(task,base=today()){
  const initial=task.due||base,[ay,am,ad]=(task.repeatAnchor||initial).split('-').map(Number);
  const threshold=initial>base?initial:base;
  const [y,m]=threshold.split('-').map(Number);
  const clampDate=(year,month)=>dayKey(year,month,Math.min(ad,new Date(year,month,0,12).getDate()));
  if(task.repeat==='monthly'){const candidate=clampDate(y,m);return candidate>threshold?candidate:clampDate(y,m+1)}

  if(task.repeat==='weekdays')while([0,6].includes(weekday(next)))next=shiftDate(next,1);
  if(task.repeat==='weekly')while(weekday(next)!==weekday(initial))next=shiftDate(next,1);
  return next;
}
// One fast-forward commit keeps the completed occurrence and the next due task together.
async function commitChanges(changes,message,scope,parents=[],scopePrefix=''){
  await verifyPrivate();
  const ref='/git/ref/heads/'+branch.split('/').map(encodeURIComponent).join('/');
  const head=(await api(ref)).object.sha,base=(await api('/git/commits/'+head)).tree.sha;

  if(snapshot.truncated)throw Error('任务库太大，无法确认版本。');
  const versions=new Map(snapshot.tree.map(item=>[item.path,item.sha]));
  for(const item of changes)if(versions.get(item.path)!==item.expected)throw Error('任务已更新，请刷新后再试。');
  for(const p of parents){
    const r=records.get(p);
    if(!r||r.data.deleted||r.sha!==versions.get(p))throw Error('目标组或清单已改变，请刷新后重试。');
  }
  if(scope){
    const scopedTree=scopePrefix?{...snapshot,tree:snapshot.tree.filter(f=>f.path.startsWith(scopePrefix))}:snapshot;
    const remote=await loadRecords(base,device.confirmed,config,scopedTree);
    const sameMembers=(map,other)=>[...map].every(([p,r])=>!scope(p,r.data)||other.get(p)?.sha===r.sha);
    if(!sameMembers(remote,records)||!sameMembers(records,remote))throw Error('组或清单的内容已改变，请刷新后重试。');
  }
  const post=(path,body,method='POST')=>api(path,{method,body:JSON.stringify(body)});
  const tree=await post('/git/trees',{base_tree:base,tree:changes.map(item=>({path:item.path,mode:'100644',type:'blob',content:JSON.stringify(item.data,null,2)}))});
  const commit=await post('/git/commits',{tree:tree.sha,parents:[head],message});
  await post(ref.replace('/git/ref/','/git/refs/'),{sha:commit.sha,force:false},'PATCH');
  const changed=new Map(tree.tree.map(item=>[item.path,item.sha]));
  // Tree creation may return only the root entries for nested paths.
  const next=new Map(device.confirmed);
  if(changes.every(c=>changed.has(c.path))){
    for(const c of changes)next.set(c.path,{data:c.data,sha:changed.get(c.path)});
    await persistRemote(device,next);
  }else await persistRemote(device,await loadRecords(commit.sha));
  records=projectFiles(device.confirmed,device.drafts);
  epoch++;
}
async function completeRepeating(record){
  const original=record.data,path=taskKey(original.id),due=nextDue(original);
  const next={...original,due,repeatAnchor:original.repeatAnchor||original.due||today(),day:'',steps:original.steps.map(s=>({...s,done:false}))};
  const history={...original,day:myDayDate(original),id:crypto.randomUUID(),done:true,repeat:'',repeatAnchor:''};
  const past=taskKey(history.id);
  await commitChanges([{path,expected:record.sha,data:next},{path:past,expected:undefined,data:history}],'完成重复任务并安排下一次');
  const nextSha=records.get(path)?.sha,pastSha=records.get(past)?.sha;
  if(editing?.id===original.id)mountEditor(records.get(path));
  notifyAction('已完成本次，下次 '+due,()=>change(async()=>{
    await commitChanges([{path,expected:nextSha,data:original},{path:past,expected:pastSha,data:{...history,deleted:true}}],'撤销完成重复任务');
    if(editing?.id===original.id)mountEditor(records.get(path));
  }));
}

async function updateTask(id,patch,undoLabel){
  if(!await finishEdit())return;
  const key=taskKey(id),current=records.get(key);
  if(!current)return;
  if(patch.done===true&&!current.data.done&&repeatNames[current.data.repeat])return change(()=>completeRepeating(records.get(key)));

  const day=today(),task=current.data;
  if('list' in patch&&patch.list!==task.list&&task.listRank)patch={...patch,listRank:''};
  if('due' in patch&&patch.due!==task.due&&task.planRank)patch={...patch,planRank:''};
  if(!('day' in patch)&&!task.done){
    if(patch.due===day){
      patch={...patch,day};
      if(task.dayDismissed)patch.dayDismissed='';
    }else if('due' in patch&&(task.due===day||(patch.due&&task.day===day))){
      patch={...patch,day:''};
      if(task.dayDismissed)patch.dayDismissed='';

      patch={...patch,day};
    }
  }
  const old=Object.fromEntries(Object.keys(patch).map(k=>[k,current.data[k]]));
  await change(async()=>{
    const base=records.get(key);if(!base||base.data.deleted&&!('deleted' in patch))return;
    await storeFile(key,{...base.data,...patch},base.sha);
    if(editing?.id===id){if(patch.deleted)closeDetail();else mountEditor(records.get(key))}
    if(undoLabel)notifyAction(undoLabel,async()=>{
      const now=records.get(key);
      if(!now||Object.keys(patch).some(k=>now.data[k]!==patch[k])){notifyAction('任务状态已改变');return}
      await updateTask(id,old);
    });

}

  if(!config){resumeNewList={kind,id,group};showSetup();return}
  const path=kind==='group'?groupKey(id):listKey(id),record=id?records.get(path):null;

  nameRequest={kind,id,group,expected:record?.sha,newId:crypto.randomUUID()};
  $('nameHeading').textContent=(id?'重命名':'新建')+noun;$('nameLabel').textContent=noun+'名称';
  $('nameSave').textContent=id?'保存':'创建';$('listName').value=record?.data.name||'';
  $('listBox').showModal();$('listName').focus();$('listName').select();
}
async function saveName(e){
  e.preventDefault();const req=nameRequest,name=$('listName').value.trim();
  if(!req||!name||busy)return;
  const {kind,id,group,newId,expected}=req,pk=kind==='group'?groupKey:listKey;
  const path=pk(id||newId);
  await change(async()=>{
    const existing=records.get(path);
    if(id&&(!existing||existing.data.deleted||existing.sha!==expected))throw Error('名称已在另一台设备上修改，请刷新后重试。');
    const data=id?{...existing.data,name}:{id:newId,name,...(group?{group}:{})};
    await storeFile(path,data,expected);$('listBox').close();
    if(group)collapsedGroups.delete(group);
    if(!id&&kind==='list')await choose('list:'+newId);
    if(!id&&kind==='group')notifyAction('已创建组「'+name+'」');
  });
  if(!id&&kind==='list'&&activeListId()===newId)$('quick').focus();
}
async function editList(id,patch){
  if(!await finishEdit())return;
  await change(async()=>{
    const path=listKey(id),r=records.get(path);if(!r||r.data.deleted)return;
    const data={...r.data,...patch};
    if('group' in patch&&patch.group!==r.data.group)delete data.position;
    await storeFile(path,data,r.sha);if(patch.group)collapsedGroups.delete(patch.group);
  });
}
async function ungroup(id){
  const g=records.get(groupKey(id))?.data;
  if(!g||g.deleted||!confirm('取消「'+g.name+'」的分组？组内清单和任务会保留在侧栏。')||!await finishEdit())return;
  await change(async()=>{
    const changes=sortedLists().filter(l=>l.group===id).map(l=>{
      const next={...l,group:''};delete next.position;return recordChange(listKey(l.id),next);
    });
    changes.push(recordChange(groupKey(id),{...g,deleted:true}));
    await commitChanges(changes,'取消清单分组',(p,d)=>p.startsWith('lists/')&&!d.deleted&&d.group===id);
  });
}
async function copyList(id){
  if(!await finishEdit())return;
  await change(async()=>{
    const source=records.get(listKey(id))?.data;if(!source||source.deleted)return;
    const allNames=new Set(sortedLists().map(l=>l.name));
    let name=source.name+'（副本）',i=2;while(allNames.has(name))name=source.name+'（副本 '+i+++'）';
    const copy={...source,id:crypto.randomUUID(),name};
    delete copy.position;
    const changes=[recordChange(listKey(copy.id),copy)];
    for(const t of entries('tasks').filter(t=>!t.deleted&&t.list===id)){
      const clone={...t,id:crypto.randomUUID(),list:copy.id};
      changes.push(recordChange(taskKey(clone.id),clone));
    }
    await commitChanges(changes,'复制清单和任务',(p,d)=>p.startsWith('tasks/')&&!d.deleted&&d.list===id,[listKey(id),...(copy.group?[groupKey(copy.group)]:[])]);
    collapsedGroups.delete(copy.group);await choose('list:'+copy.id);
  });
}
async function removeList(id){
  const l=records.get(listKey(id))?.data;if(!l||l.deleted||!await finishEdit())return;
  const tasks=entries('tasks').filter(t=>t.list===id&&!t.deleted);
  if(!confirm('删除「'+l.name+'」及其中的 '+tasks.length+' 条任务？'))return;
  await change(async()=>{
    const original=[l,...tasks],paths=[listKey(id),...tasks.map(t=>taskKey(t.id))];
    await commitChanges(original.map((d,i)=>recordChange(paths[i],{...d,deleted:true})),'删除清单及其中的任务',(p,d)=>p.startsWith('tasks/')&&!d.deleted&&d.list===id);
    const revisions=paths.map(p=>records.get(p).sha);
    if(editing&&tasks.some(t=>t.id===editing.id))closeDetail();
    notifyAction('已删除清单「'+l.name+'」',()=>change(async()=>{
      await commitChanges(original.map((data,i)=>({path:paths[i],data,expected:revisions[i]})),'撤销删除清单');
      collapsedGroups.delete(l.group);await choose('list:'+id);

  });
}

let visibleRowLimit=80,rowObserver=null;
function appendTaskRows(host,tasks){
  const batch=visibleRowLimit;
  if(!tasks.length)return;
  const group=el('div');host.append(group);
  group.append(...tasks.slice(0,batch).map(row));bindTaskRows(group,tasks);
  if(tasks.length<=batch)return;
  let shown=batch;
  const more=button('',()=>{
    const end=Math.min(shown+80,tasks.length),part=document.createDocumentFragment();
    for(const t of tasks.slice(shown,end))part.append(row(t));
    more.before(part);shown=end;visibleRowLimit=end;
    if(shown===tasks.length)more.remove();else more.textContent='显示更多任务（剩余 '+(tasks.length-shown)+'）';
  });

  if('IntersectionObserver' in window){
    rowObserver=new IntersectionObserver(items=>{if(more.isConnected&&items.some(i=>i.isIntersecting))more.click()},{root:host,rootMargin:'180px'});
    rowObserver.observe(more);
  }
}

function queueEdit(session){
  clearTimeout(session.timer);
  const run=async()=>{
    if(editing!==session||!session.dirty)return true;
    const delta={...session.patch};if(!Object.keys(delta).length)return true;
    if('title' in delta&&!delta.title.trim()){session.message.textContent='任务名称不能为空';return false}
    try{
      const key=taskKey(session.id),record=records.get(key);
      if(!record||record.data.deleted)throw Error('任务已删除');
      epoch++;session.message.textContent='正在保存…';status('正在保存…');
      const updated={...session.base,...delta};
      await stageTask(key,updated,session.base,true);
      epoch++;session.base={...session.base,...delta};
      for(const k of Object.keys(delta))if(JSON.stringify(delta[k])===JSON.stringify(session.patch[k]))delete session.patch[k];
      session.dirty=!!Object.keys(session.patch).length;session.message.textContent=session.dirty?'待保存':'已存本机';status('已同步 · 刷新');
      clearTimeout(editorPaint);editorPaint=setTimeout(render,300);return true;
    }catch(e){session.message.textContent=e.message;session.recover.hidden=false;status('修改待保存');return false}
  };
  editorQueue=editorQueue.then(run,run);return editorQueue;
}
async function finishEdit(){const s=editing;if(!s)return true;return await queueEdit(s)&&(!s.dirty||await queueEdit(s))}
function recordEdit(s,key,value){
  s.patch[key]=value;s.dirty=true;s.message.textContent='待保存';clearTimeout(s.timer);

async function loadRecords(treeRef=branch,source=device?.confirmed||records,account=config,snapshot=null){
  const tree=snapshot||await api('/git/trees/'+encodeURIComponent(treeRef)+'?recursive=1',{},account);
  if(tree.truncated)throw Error('仓库文件过多，无法完整载入。');
  const files=tree.tree.filter(f=>{
    if(f.type!=='blob')return false;
    if(!f.path.startsWith('tasks/'))return /^(groups|lists)\/[a-f\d-]{36}\.json$/i.test(f.path);
    if(!f.path.endsWith('.json'))return false;
    const id=f.path.split('/').pop().slice(0,-5);
    if(!uuid.test(id)||f.path!==taskKey(id))throw Error('云端含旧路径或异常路径的任务，请核对目录迁移后重试。');
    return true;
  });
  const next=new Map(),missing=[];
  for(const f of files){
    const old=source.get(f.path);
    if(old?.sha===f.sha)next.set(f.path,old);else missing.push(f);
  }
  function add(f,data){
    const kind=f.path.split('/')[0];
    if(!uuid.test(data.id)||f.path!==(kind==='tasks'?taskKey(data.id):kind+'/'+data.id+'.json'))throw Error('任务文件格式无效');
    next.set(f.path,{sha:f.sha,data});
  }
  if(!missing.length&&next.size===source.size)return source;
  if(missing.length<8){
    for(const f of missing)add(f,decode((await api('/git/blobs/'+f.sha,{},account)).content));
    return next;
  }
  const [owner,name]=account.repo.split('/');
  for(let i=0;i<missing.length;i+=50){
    const batch=missing.slice(i,i+50);
    const fields=batch.map((f,j)=>{
      if(!/^[0-9a-f]{40}$/.test(f.sha))throw Error('文件版本无效');
      return 'b'+j+':object(oid:"'+f.sha+'"){... on Blob{text isTruncated}}';
    }).join(' ');
    const query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){'+fields+'}}';
    const response=await fetch('https://api.github.com/graphql',{method:'POST',redirect:'error',
      headers:{Authorization:'Bearer '+account.token,'Content-Type':'application/json'},
      body:JSON.stringify({query,variables:{owner,name}})});
    if(!response.ok)throw await githubError(response);
    const result=await response.json();
    if(result.errors?.length)throw Error('批量读取失败：'+result.errors[0].message);
    for(const [j,f] of batch.entries()){
      const blob=result.data?.repository?.['b'+j];
      if(!blob||blob.isTruncated||typeof blob.text!=='string'){
        add(f,decode((await api('/git/blobs/'+f.sha,{},account)).content));
      }else add(f,JSON.parse(blob.text));
    }
    status('正在读取 '+next.size+' / '+files.length);
  }
  return next;
}
async function refresh(force=false){
  if(lastRenderDay!==today())render();
  if(!device||busy||refreshing||Date.now()<retryAt||(!force&&Date.now()-lastCheck<3000))return;
  const dev=device,account=config,ticket=epoch;
  refreshing=true;lastCheck=Date.now();
  try{
    if(!dev.verified){
      const meta=await api('',{},account);
      if(!meta.private||meta.default_branch!==dev.ref)throw Error('私有库或默认分支已变化，请检查同步设置。');
      dev.verified=true;
    }
    const head=(await api(refPath(dev.ref),{},account)).object.sha;
    if(dev!==device)return;
    if(head!==headSeen){
      const next=await loadRecords(head,dev.confirmed);
      if(dev!==device||ticket!==epoch)return;
      if(next!==dev.confirmed){
        await persistRemote(dev,next);
        if(dev!==device)return;
        records=projectFiles(dev.confirmed,dev.drafts);render();
        if(editing&&!editing.dirty&&!$('detail').contains(document.activeElement)&&!equal(editing.base,records.get(taskKey(editing.id))?.data)){
          const current=records.get(taskKey(editing.id));
          if(!current||current.data.deleted)closeDetail();else mountEditor(current);
        }
      }
      rememberHead(dev,head);
    }
    if(!dev.drafts.size)syncError='';
    status('已同步 · 刷新');scheduleUpload();
  }catch(e){if(dev===device){syncError=e.message;retryAt=Math.max(retryAt,e.retryAt||0);status(e.message)}}
  finally{refreshing=false}
}
async function syncNow(){
  if(!config||!device)return showSetup();
  if(showConflict())return;
  for(const [p,d] of device.drafts)if(d.issue){
    notifyAction(d.issue);
    const pair=await editEntry(device,p,(file,latest)=>latest?[file,{...latest,issue:null}]:null);
    reflect(device,p,...pair);
  }

  scheduleUpload(0);await refresh(true);
}

async function storeFile(path,data,sha){

const backupFormat = 'to-doo-backup';
const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const restoreGuide='将每条记录写为 UTF-8 JSON。组写入 groups/{id}.json，清单写入 lists/{id}.json，任务写入 tasks/{首位}/{id}.json。首位取任务 UUID 的第一个字符并转为小写（0–9 或 a–f），文件名保留原 ID。保留全部字段、空组、空清单和删除标记。用清单的 group 关联组 ID，用任务的 list 关联清单 ID，按原字段恢复步骤和排序。';
function makeBackup(map) {
  const pick = prefix => [...map].filter(([path]) => path.startsWith(prefix)).map(([, record]) => record.data);
  return {format:backupFormat, version:3, exportedAt:new Date().toISOString(),
    fields:{groups:'Each group has an id and name. Ungrouped groups and deleted lists can carry deleted=true.',lists:'group references groups.id. Empty or absent means ungrouped. In each group, including ungrouped, lists with a nonnegative integer position come first in ascending order from 0. Break ties and order unpositioned lists by Chinese name (numeric collation), then id. The task sort field accepts star, due, day, name, created, or manual (default). Empty groups and lists are retained.',
      tasks:'list references lists.id. An empty list identifies an unassigned task from an older version. day and due are local YYYY-MM-DD dates. My Day includes tasks with day equal to today and also open tasks due today unless optional dayDismissed equals today. Exclude deleted tasks and deleted lists. created is Unix milliseconds. Manual ordering uses optional listRank, dayRank, starRank, planRank, searchRank or legacyRank per view. Sort ascending by the hex rank prefix plus the hyphenless task ID and 8. Default prefix is (2^53-1 minus created) as 14 hex digits, preceded in Planned by YYYYMMDD. done, star, deleted and steps[].done are booleans. Optional repeat: daily, weekdays, weekly, monthly, yearly. repeatAnchor is the calendar reference date.',
      restore:restoreGuide,guide:'https://github.com/Racuu/todo-web/blob/main/docs/data.md#备份与恢复'},
    groups:pick('groups/'), lists:pick('lists/'), tasks:pick('tasks/')};
}
function readBackup(data) {
  if(data?.format!==backupFormat || ![1,2,3].includes(data.version) || (data.version>=2&&!Array.isArray(data.groups)) || !Array.isArray(data.lists) || !Array.isArray(data.tasks)) throw Error('请选择 To Doo 的 JSON 完整备份（第 1 至第 3 版）。');
  const map=new Map(), text=s=>typeof s==='string', date=s=>text(s)&&(!s||/^\d{4}-\d{2}-\d{2}$/.test(s));
  function add(path,record){if(map.has(path))throw Error('备份中有重复编号。');map.set(path,{data:record})}
  for(const g of data.groups||[]){
    if(!g||!uuid.test(g.id)||!text(g.name)||!g.name.trim()||('deleted' in g&&typeof g.deleted!=='boolean'))throw Error('组的名称或编号无效。');
    add(groupKey(g.id),g);
  }
  for(const l of data.lists){
    if(l?.group&&!map.has(groupKey(l.group)))throw Error('有清单引用了缺失的组。');
    if(l?.sort&&!Object.hasOwn(sortLabels,l.sort))throw Error('清单排序无效。');
    if(!l||!uuid.test(l.id)||!text(l.name)||!l.name.trim())throw Error('清单名称或编号无效。');
    if('position' in l&&!hasListPosition(l))throw Error('清单位置必须是非负整数。');
    add(listKey(l.id),l);
  }
  for(const t of data.tasks){
    if(!t||!uuid.test(t.id)||!text(t.title)||!t.title.trim()||!text(t.note)||!text(t.list)||!date(t.day)||!date(t.due)||('dayDismissed' in t&&!date(t.dayDismissed))||(t.repeat && !Object.hasOwn(repeatNames,t.repeat))||(t.repeatAnchor && (!date(t.repeatAnchor)||!Number.isFinite(Date.parse(t.repeatAnchor+'T12:00:00'))))||
      !Number.isFinite(t.created)||[t.done,t.star,t.deleted].some(x=>typeof x!=='boolean')||
      !Array.isArray(t.steps)||t.steps.some(s=>!s||!text(s.title)||typeof s.done!=='boolean'))throw Error('任务或步骤格式不完整。');
    if(t.list&&!map.has(listKey(t.list)))throw Error('有任务引用了缺失的清单，未恢复。');
    add(taskKey(t.id),t);
  }

}
function csvData(data) {
  const lists=new Map(data.lists.map(l=>[l.id,l]));
  const groups=new Map((data.groups||[]).map(g=>[g.id,g.name]));
  const header=['任务编号','清单编号','清单','任务','状态','重要','我的一天','截止日期','创建时间','备注','步骤（JSON）','已删除','重复','重复基准日','组编号','组','手动移出我的一天的日期'];
  const cell=value=>{let s=String(value??'');if(/^[\s]*[=+@-]|^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};
  const rows=data.tasks.map(t=>[t.id,t.list,lists.get(t.list)?.name||'待归类',t.title,t.done?'已完成':'待处理',t.star?'是':'否',lists.get(t.list)?.deleted?t.day:myDayDate(t),t.due,new Date(t.created).toISOString(),t.note,JSON.stringify(t.steps),t.deleted?'是':'否',repeatNames[t.repeat]||'',t.repeatAnchor||'',lists.get(t.list)?.group||'',groups.get(lists.get(t.list)?.group)||'未分组',t.dayDismissed||'']);
  return '\ufeff'+[header,...rows].map(r=>r.map(cell).join(',')).join('\r\n');
}

async function restoreMissing(){
  if(!incoming||archiveBusy)return;
  if(!config){archiveMessage('请先在同步设置中连接目标私有任务库，备份浏览无需登录。');return}
  archiveBusy=true;busy=true;epoch++;lockControls();$('restore').disabled=true;
  try{
    await beforeCloudChange();await verifyPrivate();
    const refPath='/git/ref/heads/'+branch.split('/').map(encodeURIComponent).join('/');
    const head=(await api(refPath)).object.sha, base=(await api('/git/commits/'+head)).tree.sha;
    const remote=await loadRecords(base), additions=[];let skipped=0,conflicts=0;
    const replace=$('replaceChanged').checked;
    for(const [path,{data}] of incoming){
      if(!remote.has(path))additions.push({path,mode:'100644',type:'blob',content:JSON.stringify(data,null,2)});
      else if(JSON.stringify(remote.get(path).data)===JSON.stringify(data))skipped++;
      else {conflicts++;if(replace)additions.push({path,mode:'100644',type:'blob',content:JSON.stringify(data,null,2)})}
    }
    const summary='新增 '+(additions.length-(replace?conflicts:0))+' 条，相同 '+skipped+' 条，差异 '+conflicts+' 条（'+(replace?'用备份版本替换':'保留云端版本')+'）。';
    if(!additions.length){archiveMessage(summary);return}
    if(!confirm('恢复到 '+config.repo+'？'+summary))return;
    const post=(path,body,method='POST')=>api(path,{method,body:JSON.stringify(body)});
    const tree=await post('/git/trees',{base_tree:base,tree:additions});
    const commit=await post('/git/commits',{message:'从 To Doo 完整备份恢复清单和任务',tree:tree.sha,parents:[head]});
    await post(refPath.replace('/git/ref/','/git/refs/'),{sha:commit.sha,force:false},'PATCH');
    archiveMessage('已恢复。'+summary);await persistRemote(device,await loadRecords());records=projectFiles(device.confirmed,device.drafts);render();status('已同步 · 刷新');
  }catch(e){archiveMessage('请刷新后核对目标仓库，再重试。'+e.message)}
  finally{busy=false;archiveBusy=false;lockControls();$('restore').disabled=false}
}

$('lookup').onkeydown=e=>{if(e.key==='Enter')setDrawer(false)};
document.addEventListener('keydown',async e=>{
  if(e.isComposing||document.querySelector('dialog[open]'))return;
  const shortcut=taskShortcut(e);
  const taskId=e.target.closest('article[data-task-id]')?.dataset.taskId||($('detail').contains(e.target)&&editing?.id);
  if(shortcut&&taskId){e.preventDefault();runTaskAction(taskId,shortcut);return}
  if(e.key==='Escape'){
    if(!await finishEdit())return;
    if(!$('detail').hidden){await returnToLayer()}
    else if(view==='search')choose(previousView);
    else setDrawer(false);
  }
});
window.addEventListener('beforeunload',e=>{if(editing?.dirty){e.preventDefault();e.returnValue=''}});
$('settings').onclick=showSetup;$('drawer').onclick=()=>setDrawer(!$('side').classList.contains('open'));$('sync').onclick=syncNow;$('dismiss').onclick=()=>{resumeNewList=false;$('setup').close()};
$('setup').addEventListener('cancel',()=>{resumeNewList=false});
function clearWorkspace(){
  collapsedGroups.clear();pendingAdd=null;draftList='';taskDrafts.clear();$('quick').value='';
  view=previousView=defaultView;filterText='';$('lookup').value='';closeDetail();
}
async function disconnect(){
  const dev=device;
  if(dev){await finishEdit();if(editing?.dirty)return;
    if(uploading)await uploading.catch(()=>{});
    if(dev.drafts.size&&!confirm('此设备还有待同步修改。断开后会保留这些修改，重新连接同一仓库可继续同步。确定断开？'))return;
    if(!dev.drafts.size){await transaction(dev,['files'],'readwrite',tx=>tx.objectStore('files').clear());localStorage.removeItem(headKey(dev))}
  }
  resetConnection();sessionStorage.removeItem(key);localStorage.removeItem(key);
  $('token').value='';status('连接 GitHub');render();$('setup').close();
}
function resetConnection(){
  clearTimeout(uploadTimer);clearTimeout(editorPaint);
  if(editing)clearTimeout(editing.timer);device?.db.close();device=null;
  epoch++;branch='';config=null;records=new Map();lastCheck=retryAt=0;headSeen=syncError='';clearWorkspace();
}
$('forget').onclick=()=>{resumeNewList=false;disconnect().catch(e=>$('setupError').textContent=e.message)};
async function connect(c,remember,restoring=false){
  if(!await finishEdit())return;
  if(uploading)await uploading.catch(()=>{});
  resetConnection();busy=true;lockControls();config=c;
  try{
    if(restoring&&!c.branch){
      const prefix=key+':snapshot:'+c.repo.toLowerCase()+':';
      const old=Object.keys(sessionStorage).concat(Object.keys(localStorage)).find(k=>k.startsWith(prefix));
      if(old)c={...c,branch:old.slice(prefix.length)};
    }
    if(!restoring||!c.branch)await verifyPrivate();else branch=c.branch;
    device=await openDevice(c.repo,branch);await readDevice(device);
    const keep=remember||restoring&&!sessionStorage.getItem(key)?localStorage:sessionStorage;
    const other=keep===localStorage?sessionStorage:localStorage;
    keep.setItem(key,JSON.stringify({...c,branch}));other.removeItem(key);localStorage.setItem(key+':repo',c.repo);
    records=projectFiles(device.confirmed,device.drafts);
    $('token').value='';$('setupError').textContent='';$('setup').close();render();
    const warm=records.size>0;
    if(warm){headSeen=localStorage.getItem(headKey(device))||'';busy=false;lockControls();status('已读本机 · 正在检查更新')}
    if(restoring&&c.branch)await verifyPrivate();
    device.verified=true;
    const current=device;
    if(!warm){
      status('首次载入任务库…');
      const head=(await api(refPath(branch))).object.sha;
      const next=await loadRecords(head);
      if(device!==current)return;
      await persistRemote(current,next);rememberHead(current,head);records=projectFiles(current.confirmed,current.drafts);render();
    }
    busy=false;lockControls();status(warm?'已读本机 · 正在检查更新':'已同步 · 刷新');scheduleUpload();
    if(warm)refresh(true);
  }catch(e){
    syncError=e.message;retryAt=e.retryAt||0;
    if(device&&records.size){status(e.message)}
    else{resetConnection();if(!$('setup').open)$('setup').showModal();$('setupError').textContent=e.message;status('连接 GitHub')}
  }finally{busy=false;lockControls()}
  if(device&&resumeNewList){const {kind,id,group}=resumeNewList;resumeNewList=false;await nameDialog(kind,id,group)}
}
$('connect').onsubmit=e=>{e.preventDefault();const repo=$('repo').value.trim(),token=$('token').value.trim();if(!/^[a-z\d-]+\/[\w.-]+$/i.test(repo)||!token){$('setupError').textContent='请填写用户名/仓库名及令牌。';return}connect({repo,token},$('remember').checked)};
render();let saved;try{saved=JSON.parse(sessionStorage.getItem(key)||localStorage.getItem(key)||'null')}catch{}if(saved)connect(saved,false,true);else status('连接 GitHub');setInterval(()=>{if(!document.hidden)refresh()},60000);
window.addEventListener('focus',()=>refresh());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></html>
