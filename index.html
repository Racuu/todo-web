<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#284b70"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://api.github.com; img-src data:; base-uri 'none'; form-action 'none'"><title>逐日 · 我的待办</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#26374a;background:#eef3f7;font:16px/1.5 system-ui,"Microsoft Yahei",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer;border-radius:8px;padding:7px 10px}button:hover{background:#e3edf6}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4c849f;outline-offset:2px}button:disabled{opacity:.5;cursor:wait}input,textarea,select{background:white;border:1px solid #c7d2dd;border-radius:7px;padding:9px;width:100%}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}label{display:block;margin:12px 0;font-size:14px}label input:not([type=checkbox]),label textarea,label select{display:block;margin-top:5px}h1,h2,h3,p{margin:0}#app{display:flex;height:100dvh;min-height:350px}.side,.detail{background:#fafcfd;padding:22px 16px;overflow:auto}.side{width:230px;border-right:1px solid #d2dce3;display:flex;flex-direction:column;gap:3px}.brand{font-size:21px;letter-spacing:2px;color:#275575;font-weight:750;margin:0 0 22px}.side button{text-align:left;overflow-wrap:anywhere}.side hr{border:0;border-top:1px solid #dae1e7;width:100%;margin:13px 0}.side .selected{background:#dceaf5;color:#164b73;font-weight:700}.settings{margin-top:auto}.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:clamp(18px,4vw,54px);background:linear-gradient(155deg,#d9e8f5,#f4f4ec);overflow:hidden}.heading{display:flex;align-items:center;gap:8px}.heading h1{overflow-wrap:anywhere;font-size:clamp(26px,4vw,40px)}#stamp,#sync{font-size:13px;color:#40576d}.status{min-height:32px;margin:6px 0}.rows{overflow:auto;flex:1;padding:8px 2px}article{display:flex;align-items:center;gap:6px;background:#fff;border-radius:9px;margin:4px 0;padding:6px;min-height:54px}article .title{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}article small{display:block;font-size:12px;color:#526473}article .checked{text-decoration:line-through;color:#677787}.circle{font-size:23px;color:#38718f}.star{font-size:23px;color:#735720}.add{display:flex;gap:8px;background:white;border-radius:9px;padding:6px;margin-top:12px}.add input{border:0;min-width:0}.primary,.primary:hover{background:#24597d;color:white}.detail{width:min(340px,32vw);border-left:1px solid #d1dce6}.detail textarea{min-height:85px;resize:vertical}.step{display:flex;align-items:center;gap:5px;margin:6px 0}.step input[type=text]{min-width:0}.muted{color:#586c7b;font-size:14px}details{margin:12px 0}summary{cursor:pointer}dialog{border:1px solid #bacbd5;border-radius:14px;padding:24px;width:min(450px,92vw);color:inherit}dialog::backdrop{background:#14273966}.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}.error{color:#a03122;font-size:14px}.empty{padding:25px 4px;color:#546575}#drawer{display:none}[hidden]{display:none!important}.danger{color:#9c3429}
@media(max-width:750px){.side{display:none}.side.open{display:flex;position:fixed;inset:0;z-index:2;width:100%}.main{padding:22px 14px 14px}.detail{position:fixed;z-index:3;inset:0;width:100%;padding:20px}.heading #drawer{display:block}.settings{margin-top:16px}}
</style>
<div id="app"><aside class="side" id="side"><div class="brand">逐日待办</div><div id="smart"></div><hr><div id="lists"></div><button id="newList">＋ 新建清单</button><button class="settings" id="settings">同步设置</button></aside><main class="main"><div class="heading"><button id="drawer" aria-label="打开清单">☰</button><h1 id="heading">我的一天</h1></div><p id="stamp"></p><div class="status"><button id="sync" aria-live="polite">连接 GitHub</button></div><section class="rows" id="rows"></section><form class="add" id="add"><input id="quick" maxlength="500" aria-label="新任务" placeholder="＋ 添加任务" required autocomplete="off"><button class="primary">添加</button></form></main><aside class="detail" id="detail" hidden></aside></div>
<dialog id="setup"><h2>连接私有任务库</h2><p class="muted">手机和电脑填写同一个私有仓库。令牌仅用于访问 GitHub。</p><form id="connect"><label>GitHub 用户名 / 仓库名<input id="repo" placeholder="你的用户名/todo-data" required autocomplete="off"></label><label>此设备的细粒度令牌<input type="password" id="token" required autocomplete="off"></label><label><input type="checkbox" id="remember"> 在这台私人设备上记住令牌</label><p id="setupError" class="error" role="alert"></p><div class="actions"><button class="primary">连接</button><button type="button" id="dismiss">关闭</button><button type="button" id="forget">断开此设备</button></div></form></dialog>
<dialog id="listBox"><h2>新建清单</h2><form id="listForm"><label>清单名称<input id="listName" required maxlength="60"></label><button class="primary">创建</button><button type="button" id="cancelList">取消</button></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), el=(tag,txt)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;return e};
const button=(txt,action)=>{const b=el('button',txt);b.type='button';b.onclick=action;return b};
const smart=[['day','☼','我的一天'],['star','☆','重要'],['plan','▦','计划内'],['all','☷','所有任务'],['inbox','▤','任务']];
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const key='zhuri:'+location.pathname;let pendingAdd=null;let config=null, branch='', records=new Map(),view='day',editing=null,busy=false,refreshing=false,epoch=0;
const listKey=id=>'lists/'+id+'.json',taskKey=id=>'tasks/'+id+'.json';
const entries=kind=>[...records].filter(([p])=>p.startsWith(kind+'/')).map(([,v])=>v.data);
const listTitle=id=>records.get(listKey(id))?.data.name||'任务';
const freshTask=title=>({id:crypto.randomUUID(),title,done:false,star:view==='star',day:view==='day'?today():'',due:view==='plan'?today():'',list:view.startsWith('list:')?view.slice(5):'',note:'',steps:[],created:Date.now(),deleted:false});
function status(s){$('sync').textContent=s}
function showSetup(){if(busy)return;$('repo').value=config?.repo||localStorage.getItem(key+':repo')||'';$('token').value='';$('setupError').textContent='';$('setup').showModal()}
function matches(t){return !t.deleted&&(view==='all'||view==='day'&&t.day===today()||view==='star'&&t.star||view==='plan'&&t.due||view==='inbox'&&!t.list||view==='list:'+t.list)}
function closeDetail(){editing=null;$('detail').hidden=true}
function choose(id){if(editing?.dirty&&!confirm('放弃未保存的修改？'))return;view=id;closeDetail();$('side').classList.remove('open');render()}
function nav(container,id,label){const b=button(label,()=>choose(id));b.style.cssText='display:block;width:100%';if(id===view)b.className='selected';container.append(b)}
function row(t){const a=el('article'),done=button(t.done?'✓':'○',()=>writeTask(t,{done:!t.done}));done.className='circle';done.setAttribute('aria-label',t.done?'恢复待办':'标记完成');const b=button('',()=>openTask(t));b.className='title';const title=el('span',t.title);if(t.done)title.className='checked';b.append(title,el('small',[listTitle(t.list),t.due,t.steps.length?t.steps.filter(s=>s.done).length+'/'+t.steps.length+' 步':null].filter(Boolean).join(' · ')));const star=button(t.star?'★':'☆',()=>writeTask(t,{star:!t.star}));star.className='star';star.setAttribute('aria-label',t.star?'取消重要':'标为重要');a.append(done,b,star);return a}
function render(){const name=smart.find(x=>x[0]===view)?.[2]||listTitle(view.slice(5));$('heading').textContent=name;$('stamp').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('smart').replaceChildren();smart.forEach(([id,icon,label])=>nav($('smart'),id,icon+'　'+label));$('lists').replaceChildren();entries('lists').sort((a,b)=>a.name.localeCompare(b.name)).forEach(l=>nav($('lists'),'list:'+l.id,'≡　'+l.name));const tasks=entries('tasks').filter(matches).sort((a,b)=>view==='plan'?a.due.localeCompare(b.due)||b.created-a.created:b.created-a.created);const rows=$('rows'),expanded=rows.querySelector('details')?.open;rows.replaceChildren();if(!tasks.length)rows.append(Object.assign(el('p',config?'这个清单里还没有任务。':'连接私有任务库后，就能在这里添加任务。'),{className:'empty'}));tasks.filter(t=>!t.done).forEach(t=>rows.append(row(t)));const done=tasks.filter(t=>t.done);if(done.length){const d=el('details');d.open=!!expanded;d.append(el('summary','已完成 · '+done.length),...done.map(row));rows.append(d)}}
function lockControls(){document.querySelectorAll('#app button:not(#drawer),#detail input,#detail textarea,#detail select,#quick,#connect button,#listForm button').forEach(e=>e.disabled=busy)}
async function api(path,options={}){const r=await fetch('https://api.github.com/repos/'+config.repo+path,{...options,cache:'no-store',redirect:'error',headers:{Authorization:'Bearer '+config.token,Accept:'application/vnd.github+json',...(options.body?{'Content-Type':'application/json'}:{})}});if(!r.ok){const msg=r.status===409||r.status===422?'版本发生变化或提交被拒绝。请重新读取云端后再试。':r.status===404?'找不到仓库或文件。请检查仓库名、README 和令牌权限。':r.status===401?'令牌无效或已过期。':r.status===403?'访问被拒绝。请检查权限或稍后再试。':'GitHub 请求失败（'+r.status+'）';throw Error(msg)}return r.json()}
async function verifyPrivate(){const meta=await api('');if(meta.private!==true)throw Error('请选择私有仓库保存待办。');branch=meta.default_branch}
function decode(s){const bytes=Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function encode(d){const bytes=new TextEncoder().encode(JSON.stringify(d,null,2));let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
async function loadRecords(){const tree=await api('/git/trees/'+encodeURIComponent(branch)+'?recursive=1');if(tree.truncated)throw Error('仓库文件过多，无法完整载入。');const files=tree.tree.filter(f=>f.type==='blob'&&/^(lists|tasks)\/[a-f\d-]{36}\.json$/.test(f.path));const next=new Map();for(let i=0;i<files.length;i+=6){await Promise.all(files.slice(i,i+6).map(async f=>{const old=records.get(f.path);if(old?.sha===f.sha){next.set(f.path,old);return}const blob=await api('/git/blobs/'+f.sha);const data=decode(blob.content);if(f.path!== (f.path.startsWith('tasks/')?taskKey(data.id):listKey(data.id)))throw Error('任务文件格式无效');next.set(f.path,{sha:f.sha,data})}))}return next}
async function refresh(){if(!config||busy||refreshing||!branch)return;refreshing=true;const ticket=epoch;try{const next=await loadRecords();if(ticket===epoch){records=next;render();status('已同步 · 刷新')}}catch(e){if(ticket===epoch)status(e.message)}finally{refreshing=false}}
async function storeFile(path,data,sha){await verifyPrivate();const out=await api('/contents/'+path,{method:'PUT',body:JSON.stringify({message:'更新待办清单',branch,content:encode(data),...(sha?{sha}:{})})});records.set(path,{data,sha:out.content.sha})}
async function change(fn){if(!config){showSetup();return}if(busy)return;busy=true;epoch++;lockControls();status('正在保存…');try{await fn();render();status('已同步 · 刷新')}catch(e){status(e.message);alert(e.message)}finally{busy=false;lockControls()}}
function writeTask(t,patch){const p=taskKey(t.id);return change(()=>storeFile(p,{...t,...patch},records.get(p).sha))}
function openTask(t){if(editing?.dirty&&!confirm('放弃未保存的修改？'))return;const p=taskKey(t.id),snapshot=structuredClone(t),sha=records.get(p).sha;editing={dirty:false};const panel=$('detail');panel.hidden=false;panel.replaceChildren();const back=button('‹ 返回清单',()=>{if(!editing.dirty||confirm('放弃未保存的修改？'))closeDetail()});panel.append(back,el('h2','任务详情'));const field=(label,type,value)=>{const l=el('label',label),i=el(type==='textarea'?'textarea':type==='select'?'select':'input');if(i.tagName==='INPUT')i.type=type;if(type==='checkbox')i.checked=value;else i.value=value;l.append(i);panel.append(l);return i};const title=field('任务名称','text',t.title);title.maxLength=500;const day=field('加入我的一天','checkbox',t.day===today()),star=field('标为重要','checkbox',t.star),due=field('截止日期','date',t.due),list=field('移动到清单','select','');list.add(new Option('任务',''));entries('lists').forEach(l=>list.add(new Option(l.name,l.id)));list.value=t.list;const note=field('备注','textarea',t.note);note.maxLength=16000;panel.append(el('h3','步骤'));const steps=el('div');panel.append(steps);function step(s){const line=el('div');line.className='step';const c=el('input');c.type='checkbox';c.checked=s.done;c.setAttribute('aria-label','步骤已完成');const v=el('input');v.type='text';v.maxLength=500;v.placeholder='步骤内容';v.value=s.title;const del=button('×',()=>{line.remove();editing.dirty=true});del.setAttribute('aria-label','移除步骤');line.append(c,v,del);steps.append(line)}t.steps.forEach(step);panel.append(button('＋ 添加步骤',()=>{step({done:false,title:''});editing.dirty=true;steps.lastChild.children[1].focus()}));const actions=el('div');actions.className='actions';const save=button('保存修改',()=>{if(!title.value.trim()){title.focus();return}const data={...snapshot,title:title.value.trim(),day:day.checked?today():'',star:star.checked,due:due.value,list:list.value,note:note.value,steps:[...steps.children].map(line=>({done:line.children[0].checked,title:line.children[1].value.trim()})).filter(s=>s.title)};change(async()=>{await storeFile(p,data,sha);closeDetail()})});save.className='primary';const del=button('删除任务',()=>{if(confirm('删除这条任务？'))change(async()=>{await storeFile(p,{...snapshot,deleted:true},sha);closeDetail()})});del.className='danger';actions.append(save,del);panel.append(actions);panel.oninput=()=>{if(editing)editing.dirty=true}}
$('add').onsubmit=e=>{e.preventDefault();const title=$('quick').value.trim();if(!title)return;if(!pendingAdd||pendingAdd.title!==title||pendingAdd.view!==view)pendingAdd={title,view,task:freshTask(title)};const t=pendingAdd.task;change(async()=>{const known=records.get(taskKey(t.id));if(!known)await storeFile(taskKey(t.id),t);pendingAdd=null;$('quick').value=''})};
$('newList').onclick=()=>{if(!config){showSetup();return}$('listName').value='';$('listBox').showModal()};$('cancelList').onclick=()=>$('listBox').close();$('listForm').onsubmit=e=>{e.preventDefault();const name=$('listName').value.trim();if(!name)return;const l={id:crypto.randomUUID(),name};change(async()=>{await storeFile(listKey(l.id),l);$('listBox').close();choose('list:'+l.id)})};
$('settings').onclick=showSetup;$('drawer').onclick=()=>$('side').classList.toggle('open');$('sync').onclick=()=>config&&branch?refresh():showSetup();$('dismiss').onclick=()=>$('setup').close();
function disconnect(){epoch++;branch='';config=null;pendingAdd=null;records.clear();closeDetail();view='day';$('quick').value='';sessionStorage.removeItem(key);localStorage.removeItem(key);$('token').value='';status('连接 GitHub');render()}
$('forget').onclick=()=>{disconnect();$('setup').close()};
async function connect(c,remember){busy=true;epoch++;lockControls();records.clear();branch='';config=c;try{await verifyPrivate();records=await loadRecords();localStorage.setItem(key+':repo',c.repo);sessionStorage.removeItem(key);localStorage.removeItem(key);(remember?localStorage:sessionStorage).setItem(key,JSON.stringify(c));$('token').value='';$('setupError').textContent='';$('setup').close();closeDetail();render();status('已同步 · 刷新')}catch(e){disconnect();if(!$('setup').open)$('setup').showModal();$('setupError').textContent=e.message}finally{busy=false;lockControls()}}
$('connect').onsubmit=e=>{e.preventDefault();const repo=$('repo').value.trim(),token=$('token').value.trim();if(!/^[a-z\d-]+\/[\w.-]+$/i.test(repo)||!token){$('setupError').textContent='请填写用户名/仓库名及令牌。';return}connect({repo,token},$('remember').checked)};
render();let saved;try{saved=JSON.parse(sessionStorage.getItem(key)||localStorage.getItem(key)||'null')}catch{}if(saved)connect(saved,!!localStorage.getItem(key));else status('连接 GitHub');setInterval(()=>{if(!document.hidden)refresh()},30000);window.addEventListener('focus',refresh);
</script></html>
