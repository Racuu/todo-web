<script>
'use strict';
const $=id=>document.getElementById(id), el=(tag,txt)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;return e};

const smart=[['day','☼','我的一天'],['star','☆','重要'],['plan','▦','计划内']];

const key='zhuri:'+location.pathname;let pendingAdd=null;let config=null, branch='', records=new Map(),view='home',editing=null,busy=false,refreshing=false,epoch=0;
const listKey=id=>'lists/'+id+'.json',taskKey=id=>'tasks/'+id+'.json';
const entries=kind=>[...records].filter(([p])=>p.startsWith(kind+'/')).map(([,v])=>v.data);

const savedListKey=()=>key+':last-list:'+config.repo.toLowerCase();
const activeListId=()=>view.startsWith('list:')&&records.has(listKey(view.slice(5)))?view.slice(5):'';
function defaultView(lists){
  const remembered=config&&localStorage.getItem(savedListKey());
  const preferred=lists.find(l=>l.id===remembered)||lists[0];
  return preferred?'list:'+preferred.id:'home';
}
let resumeNewList=false;
const taskDrafts=new Map();
let draftList='';
const freshTask=(title,list)=>({id:crypto.randomUUID(),title,done:false,star:false,day:'',due:'',list,note:'',steps:[],created:Date.now(),deleted:false});
function status(s){$('sync').textContent=s}
function showSetup(){if(busy)return;$('repo').value=config?.repo||localStorage.getItem(key+':repo')||'Racuu/todo-data';$('token').value='';$('setupError').textContent='';$('setup').showModal()}
const glyphs={day:'M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M19 5l-1.4 1.4M6.4 17.6L5 19M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0',star:'m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3-5.7-3-5.7 3 1.1-6.3L2.8 9.7l6.4-.9z',plan:'M4 6h16v15H4z M4 10h16M8 3v5m8-5v5',list:'M4 7h16M4 12h16M4 17h11'};
function nav(container,id,label){
 const b=button('',()=>choose(id)),ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),path=document.createElementNS(ns,'path');
 svg.setAttribute('class','navIcon');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');
 path.setAttribute('d',glyphs[id]||glyphs.list);svg.append(path);b.append(svg,el('span',label));

}
let filterText='', previousView='home', showingPicks=false, undoTimer;
let editorQueue=Promise.resolve();
function squareTick(){
  const mark=el('span');mark.className='mark';mark.setAttribute('aria-hidden','true');return mark;
}
function iconToggle(label,active,kind,act){
  const btn=button('',act);btn.className='toggle '+kind;btn.setAttribute('aria-label',label);
  btn.setAttribute('aria-pressed',String(active));btn.title=label;
  const symbol=el('span',kind==='star'?(active?'★':'☆'):(active?'✓':''));symbol.setAttribute('aria-hidden','true');btn.append(symbol);return btn;
}
function dates(offset=0){
  const d=new Date();d.setDate(d.getDate()+offset);
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function dueName(d){return d===today()?'今天':d===dates(1)?'明天':d}
function inView(t,id){
  if(t.deleted)return false;
  if(id==='search'){const q=filterText.trim().toLocaleLowerCase();return q&&[t.title,t.note,listTitle(t.list),...t.steps.map(s=>s.title)].some(x=>x.toLocaleLowerCase().includes(q))}
  return id==='day'&&t.day===today()||id==='star'&&t.star||id==='plan'&&!!t.due||id==='legacy'&&!t.list||id==='list:'+t.list;
}
function suggestions(tasks){
  const todayKey=today();
  const rank=t=>t.due&&t.due<=todayKey?0:t.day&&t.day<todayKey?1:t.star?2:3;
  return tasks.filter(t=>!t.deleted&&!t.done&&t.day!==todayKey).sort((a,b)=>rank(a)-rank(b)||b.created-a.created);
}
function closeDetail(){

}

const repeatNames={daily:'每天',weekdays:'工作日',weekly:'每周',monthly:'每月',yearly:'每年'};
function dayKey(y,m,d){
  const date=new Date(y,m-1,d,12);
  return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
}
function shiftDate(key,days){const [y,m,d]=key.split('-').map(Number);return dayKey(y,m,d+days)}
function weekday(key){return new Date(key+'T12:00:00').getDay()}
function weekdayName(key){return '周'+'日一二三四五六'[weekday(key)]}
function dateCaption(key){const [,m,d]=key.split('-').map(Number);return m+'月'+d+'日, '+weekdayName(key)}
function nextMonday(base){return shiftDate(base,8-(weekday(base)||7))}
function plannedBuckets(base){
  const next=shiftDate(base,1),start=shiftDate(base,2),end=shiftDate(base,6);
  return [
    {id:'prior',title:'先前',accept:d=>d<base},
    {id:'today',title:'今天',accept:d=>d===base},
    {id:'tomorrow',title:'明天',accept:d=>d===next},
    {id:'range',title:dateCaption(start)+' 到 '+dateCaption(end),accept:d=>d>=start&&d<=end},
    {id:'later',title:'稍后',accept:d=>d>end}
  ];
}
const planExpansion=new Map();

    const part=el('details');part.className='planGroup';part.open=planExpansion.get(group.id)??false;
    const header=el('summary');header.append(el('span',group.title),el('small',subset.length));
    part.append(header,...subset.map(row));
    part.ontoggle=()=>{if(part.isConnected)planExpansion.set(group.id,part.open)};
    host.append(part);
  }
}
function nextDue(task,base=today()){
  const initial=task.due||base,[ay,am,ad]=(task.repeatAnchor||initial).split('-').map(Number);
  const threshold=initial>base?initial:base;
  const [y,m]=threshold.split('-').map(Number);
  const clampDate=(year,month)=>dayKey(year,month,Math.min(ad,new Date(year,month,0,12).getDate()));
  if(task.repeat==='monthly'){const candidate=clampDate(y,m);return candidate>threshold?candidate:clampDate(y,m+1)}
  if(task.repeat==='yearly'){const candidate=clampDate(y,am);return candidate>threshold?candidate:clampDate(y+1,am)}
  let next=shiftDate(threshold,1);
  if(task.repeat==='weekdays')while([0,6].includes(weekday(next)))next=shiftDate(next,1);
  if(task.repeat==='weekly')while(weekday(next)!==weekday(initial))next=shiftDate(next,1);
  return next;
}
// One fast-forward commit keeps the completed occurrence and the next due task together.
async function commitChanges(changes,message){
  await verifyPrivate();
  const ref='/git/ref/heads/'+branch.split('/').map(encodeURIComponent).join('/');
  const head=(await api(ref)).object.sha,base=(await api('/git/commits/'+head)).tree.sha;
  const snapshot=await api('/git/trees/'+base+'?recursive=1');
  if(snapshot.truncated)throw Error('任务库太大，无法确认版本。');
  const versions=new Map(snapshot.tree.map(item=>[item.path,item.sha]));
  for(const item of changes)if(versions.get(item.path)!==item.expected)throw Error('任务已更新，请刷新后再试。');
  const post=(path,body,method='POST')=>api(path,{method,body:JSON.stringify(body)});
  const tree=await post('/git/trees',{base_tree:base,tree:changes.map(item=>({path:item.path,mode:'100644',type:'blob',content:JSON.stringify(item.data,null,2)}))});
  const commit=await post('/git/commits',{tree:tree.sha,parents:[head],message});
  await post(ref.replace('/git/ref/','/git/refs/'),{sha:commit.sha,force:false},'PATCH');
  const changed=new Map(tree.tree.map(item=>[item.path,item.sha]));
  // Tree creation may return only the root entries for nested paths.
  if(changes.every(c=>changed.has(c.path))){for(const c of changes)records.set(c.path,{data:c.data,sha:changed.get(c.path)})}
  else records=await loadRecords();
}
async function completeRepeating(record){
  const original=record.data,path=taskKey(original.id),due=nextDue(original);
  const next={...original,due,repeatAnchor:original.repeatAnchor||original.due||today(),day:'',steps:original.steps.map(s=>({...s,done:false}))};
  const history={...original,id:crypto.randomUUID(),done:true,repeat:'',repeatAnchor:''};
  const past=taskKey(history.id);
  await commitChanges([{path,expected:record.sha,data:next},{path:past,expected:undefined,data:history}],'完成重复任务并安排下一次');
  const nextSha=records.get(path)?.sha,pastSha=records.get(past)?.sha;
  if(editing?.id===original.id)mountEditor(records.get(path));
  notifyAction('已完成本次，下次 '+due,()=>change(async()=>{
    await commitChanges([{path,expected:nextSha,data:original},{path:past,expected:pastSha,data:{...history,deleted:true}}],'撤销完成重复任务');
    if(editing?.id===original.id)mountEditor(records.get(path));
  }));
}

async function updateTask(id,patch,undoLabel){
  if(!await finishEdit())return;
  const key=taskKey(id),current=records.get(key);
  if(!current)return;
  if(patch.done===true&&!current.data.done&&repeatNames[current.data.repeat])return change(()=>completeRepeating(current));
  if('due' in patch && current.data.repeat && !('repeatAnchor' in patch))patch={...patch,repeatAnchor:patch.due};
  const old=Object.fromEntries(Object.keys(patch).map(k=>[k,current.data[k]]));
  await change(async()=>{
    await storeFile(key,{...current.data,...patch},current.sha);
    if(editing?.id===id){if(patch.deleted)closeDetail();else mountEditor(records.get(key))}
    if(undoLabel)notifyAction(undoLabel,async()=>{
      const now=records.get(key);
      if(!now||Object.keys(patch).some(k=>now.data[k]!==patch[k])){notifyAction('任务状态已改变');return}
      await updateTask(id,old);
    });
  });
}

function queueEdit(session){
  clearTimeout(session.timer);
  const run=async()=>{
    if(editing!==session||!session.dirty)return true;
    const delta={...session.patch};if(!Object.keys(delta).length)return true;
    if('title' in delta&&!delta.title.trim()){session.message.textContent='任务名称不能为空';return false}
    try{
      const key=taskKey(session.id),record=records.get(key);
      if(!record||record.data.deleted)throw Error('任务已删除');
      for(const k of Object.keys(delta)){
        if(JSON.stringify(record.data[k])!==JSON.stringify(session.base[k])&&JSON.stringify(record.data[k])!==JSON.stringify(delta[k]))throw Error('另一台设备修改了同一项，请保留草稿或读取最新版本。');
      }
      epoch++;session.message.textContent='正在保存…';status('正在保存…');
      const updated={...record.data,...delta};
      await storeFile(key,updated,record.sha);
      epoch++;session.base=updated;
      for(const k of Object.keys(delta))if(JSON.stringify(delta[k])===JSON.stringify(session.patch[k]))delete session.patch[k];
      session.dirty=!!Object.keys(session.patch).length;session.message.textContent=session.dirty?'待保存':'已保存';status('已同步 · 刷新');render();return true;
    }catch(e){session.message.textContent=e.message;session.recover.hidden=false;status('修改待保存');return false}
  };
  editorQueue=editorQueue.then(run,run);return editorQueue;
}

}

  const footer=el('div');footer.className='detailFoot';footer.append(el('small','创建于 '+new Date(t.created).toLocaleDateString('zh-CN')));
  const del=button('删除任务',()=>{if(confirm('删除这条任务？'))updateTask(t.id,{deleted:true},'任务已删除')});del.className='danger';footer.append(del);host.append(footer);
  s.recover.hidden=true;s.recover.append(button('重试保存',()=>queueEdit(s)),button('放弃草稿并刷新',async()=>{if(!confirm('放弃此任务的未保存修改并读取云端版本？'))return;closeDetail();await refresh();const r=records.get(taskKey(t.id));if(r&&!r.data.deleted)mountEditor(r);render()}));host.append(s.recover);
}
function lockControls(){document.querySelectorAll('#app button:not(#drawer),#detail input,#detail textarea,#detail select,#quick,#connect button,#listForm button').forEach(e=>e.disabled=busy)}
async function api(path,options={}){const r=await fetch('https://api.github.com/repos/'+config.repo+path,{...options,cache:'no-store',redirect:'error',headers:{Authorization:'Bearer '+config.token,Accept:'application/vnd.github+json',...(options.body?{'Content-Type':'application/json'}:{})}});if(!r.ok){const msg=r.status===409||r.status===422?'版本发生变化或提交被拒绝。请重新读取云端后再试。':r.status===404?'找不到仓库或文件。请检查仓库名、README 和令牌权限。':r.status===401?'令牌无效或已过期。':r.status===403?'访问被拒绝。请检查权限或稍后再试。':'GitHub 请求失败（'+r.status+'）';throw Error(msg)}return r.json()}
async function verifyPrivate(){const meta=await api('');if(meta.private!==true)throw Error('请选择私有仓库保存待办。');branch=meta.default_branch}
function decode(s){const bytes=Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function encode(d){const bytes=new TextEncoder().encode(JSON.stringify(d,null,2));let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
async function loadRecords(treeRef=branch){const tree=await api('/git/trees/'+encodeURIComponent(treeRef)+'?recursive=1');if(tree.truncated)throw Error('仓库文件过多，无法完整载入。');const files=tree.tree.filter(f=>f.type==='blob'&&/^(lists|tasks)\/[a-f\d-]{36}\.json$/.test(f.path));const next=new Map();for(let i=0;i<files.length;i+=6){await Promise.all(files.slice(i,i+6).map(async f=>{const old=records.get(f.path);if(old?.sha===f.sha){next.set(f.path,old);return}const blob=await api('/git/blobs/'+f.sha);const data=decode(blob.content);if(f.path!== (f.path.startsWith('tasks/')?taskKey(data.id):listKey(data.id)))throw Error('任务文件格式无效');next.set(f.path,{sha:f.sha,data})}))}return next}
async function refresh(){if(!config||busy||refreshing||!branch)return;refreshing=true;const ticket=epoch;try{const next=await loadRecords();if(ticket===epoch){records=next;render();status('已同步 · 刷新')}}catch(e){if(ticket===epoch)status(e.message)}finally{refreshing=false}}
async function storeFile(path,data,sha){await verifyPrivate();const out=await api('/contents/'+path,{method:'PUT',body:JSON.stringify({message:'更新待办清单',branch,content:encode(data),...(sha?{sha}:{})})});records.set(path,{data,sha:out.content.sha})}
async function change(fn){if(!config){showSetup();return}if(busy)return;busy=true;epoch++;lockControls();status('正在保存…');try{await fn();render();status('已同步 · 刷新')}catch(e){status(e.message);alert(e.message)}finally{busy=false;lockControls()}}
const backupFormat = 'to-doo-backup';
const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function makeBackup(map) {
  const pick = prefix => [...map].filter(([path]) => path.startsWith(prefix)).map(([, record]) => record.data);
  return {format:backupFormat, version:1, exportedAt:new Date().toISOString(),
    fields:{lists:'Each list has an id and name. Empty lists are retained.',
      tasks:'list references lists.id. An empty list identifies an unassigned task from an older version. day and due are local YYYY-MM-DD dates. created is Unix milliseconds. done, star, deleted and steps[].done are booleans. Optional repeat: daily, weekdays, weekly, monthly, yearly. repeatAnchor is the calendar reference date.',
      restore:'Write lists and tasks as UTF-8 JSON in lists/{id}.json and tasks/{id}.json in an initialized private data repo. Retain IDs and list links. Independent programs can read the arrays directly.'},
    lists:pick('lists/'), tasks:pick('tasks/')};
}
function readBackup(data) {
  if(data?.format!==backupFormat || data.version!==1 || !Array.isArray(data.lists) || !Array.isArray(data.tasks)) throw Error('请选择 To Doo 的第 1 版 JSON 完整备份。');
  const map=new Map(), text=s=>typeof s==='string', date=s=>text(s)&&(!s||/^\d{4}-\d{2}-\d{2}$/.test(s));
  function add(path,record){if(map.has(path))throw Error('备份中有重复编号。');map.set(path,{data:record})}
  for(const l of data.lists){
    if(!l||!uuid.test(l.id)||!text(l.name)||!l.name.trim())throw Error('清单名称或编号无效。');
    add(listKey(l.id),l);
  }
  for(const t of data.tasks){
    if(!t||!uuid.test(t.id)||!text(t.title)||!t.title.trim()||!text(t.note)||!text(t.list)||!date(t.day)||!date(t.due)||(t.repeat && !Object.hasOwn(repeatNames,t.repeat))||(t.repeatAnchor && (!date(t.repeatAnchor)||!Number.isFinite(Date.parse(t.repeatAnchor+'T12:00:00'))))||
      !Number.isFinite(t.created)||[t.done,t.star,t.deleted].some(x=>typeof x!=='boolean')||
      !Array.isArray(t.steps)||t.steps.some(s=>!s||!text(s.title)||typeof s.done!=='boolean'))throw Error('任务或步骤格式不完整。');
    if(t.list&&!map.has(listKey(t.list)))throw Error('有任务引用了缺失的清单，未恢复。');
    add(taskKey(t.id),t);
  }
  return map;
}
function csvData(data) {
  const names=new Map(data.lists.map(l=>[l.id,l.name]));
  const header=['任务编号','清单编号','清单','任务','状态','重要','我的一天','截止日期','创建时间','备注','步骤（JSON）','已删除','重复','重复基准日'];
  const cell=value=>{let s=String(value??'');if(/^[\s]*[=+@-]|^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};
  const rows=data.tasks.map(t=>[t.id,t.list,names.get(t.list)||'待归类',t.title,t.done?'已完成':'待处理',t.star?'是':'否',t.day,t.due,new Date(t.created).toISOString(),t.note,JSON.stringify(t.steps),t.deleted?'是':'否',repeatNames[t.repeat]||'',t.repeatAnchor||'']);
  return '\ufeff'+[header,...rows].map(r=>r.map(cell).join(',')).join('\r\n');
}
function downloadAs(name,mime,content){
  const url=URL.createObjectURL(new Blob([content],{type:mime})),link=el('a');
  link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
let incoming=null, archiveBusy=false;
function archiveMessage(text){$('restoreReport').textContent=text}
async function exportFile(csv){
  if(archiveBusy)return;archiveBusy=true;
  try{
    if(!config)throw Error('请先连接私有任务库，再导出云端数据。');
    const snapshot=makeBackup(await loadRecords());readBackup(snapshot);
    const tag=snapshot.exportedAt.replace(/[:.]/g,'-');
    downloadAs('To-Doo-'+tag+(csv?'.csv':'.json'),csv?'text/csv;charset=utf-8':'application/json',csv?csvData(snapshot):JSON.stringify(snapshot,null,2));
    archiveMessage('已生成下载：'+snapshot.lists.length+' 个清单、'+snapshot.tasks.length+' 条任务记录（含已删除）。');
  }catch(e){archiveMessage(e.message)}finally{archiveBusy=false}
}
function inspectFile(){
  const host=$('backupView');host.replaceChildren();if(!incoming)return;
  const data=makeBackup(incoming),select=el('select'),state=el('select'),results=el('div');
  select.setAttribute('aria-label','按清单筛选备份');state.setAttribute('aria-label','按状态筛选备份');
  select.add(new Option('全部清单','*'));if(data.tasks.some(t=>!t.list))select.add(new Option('待归类',''));
  data.lists.forEach(l=>select.add(new Option(l.name,l.id)));
  for(const [name,key] of [['全部状态','all'],['待处理','open'],['已完成','done'],['已删除','trash']])state.add(new Option(name,key));
  function filter(){
    results.replaceChildren();
    const rows=data.tasks.filter(t=>(select.value==='*'||select.value===t.list)&&(state.value==='trash'?t.deleted:!t.deleted&&(state.value==='all'||t.done===(state.value==='done'))));
    results.append(el('p',rows.length+' 条任务'));
    for(const t of rows){const item=el('details'),title=el('summary',t.title),name=incoming.get(listKey(t.list))?.data.name||'待归类';item.append(title,el('p',[name,t.done?'已完成':'待处理',t.star?'重要':'',t.due&&'截止 '+t.due,repeatNames[t.repeat],t.day&&'我的一天 '+t.day].filter(Boolean).join(' · ')),el('p',t.note));for(const step of t.steps)item.append(el('p',(step.done?'✓ ':'○ ')+step.title));results.append(item)}
  }
  select.onchange=state.onchange=filter;host.append(select,state,results);filter();
}
async function restoreMissing(){
  if(!incoming||archiveBusy)return;
  if(!config){archiveMessage('请先在同步设置中连接目标私有任务库，备份浏览无需登录。');return}
  archiveBusy=true;busy=true;epoch++;lockControls();$('restore').disabled=true;
  try{
    await verifyPrivate();
    const refPath='/git/ref/heads/'+branch.split('/').map(encodeURIComponent).join('/');
    const head=(await api(refPath)).object.sha, base=(await api('/git/commits/'+head)).tree.sha;
    const remote=await loadRecords(base), additions=[];let skipped=0,conflicts=0;
    const replace=$('replaceChanged').checked;
    for(const [path,{data}] of incoming){
      if(!remote.has(path))additions.push({path,mode:'100644',type:'blob',content:JSON.stringify(data,null,2)});
      else if(JSON.stringify(remote.get(path).data)===JSON.stringify(data))skipped++;
      else {conflicts++;if(replace)additions.push({path,mode:'100644',type:'blob',content:JSON.stringify(data,null,2)})}
    }
    const summary='新增 '+(additions.length-(replace?conflicts:0))+' 条，相同 '+skipped+' 条，差异 '+conflicts+' 条（'+(replace?'用备份版本替换':'保留云端版本')+'）。';
    if(!additions.length){archiveMessage(summary);return}
    if(!confirm('恢复到 '+config.repo+'？'+summary))return;
    const post=(path,body,method='POST')=>api(path,{method,body:JSON.stringify(body)});
    const tree=await post('/git/trees',{base_tree:base,tree:additions});
    const commit=await post('/git/commits',{message:'从 To Doo 完整备份恢复清单和任务',tree:tree.sha,parents:[head]});
    await post(refPath.replace('/git/ref/','/git/refs/'),{sha:commit.sha,force:false},'PATCH');
    archiveMessage('已恢复。'+summary);records=await loadRecords();render();status('已同步 · 刷新');
  }catch(e){archiveMessage('请刷新后核对目标仓库，再重试。'+e.message)}
  finally{busy=false;archiveBusy=false;lockControls();$('restore').disabled=false}
}
$('backup').onclick=()=>{$('side').classList.remove('open');$('archives').showModal()};
$('closeArchive').onclick=()=>$('archives').close();

$('previewFile').onclick=inspectFile;$('restore').onclick=restoreMissing;
$('importFile').onchange=async e=>{
  incoming=null;$('replaceChanged').checked=false;$('restoreMode').hidden=$('previewFile').hidden=$('restore').hidden=true;$('backupView').replaceChildren();archiveMessage('');$('importInfo').textContent='';
  const file=e.target.files[0];if(!file)return;

    $('importInfo').textContent=data.lists.length+' 个清单、'+data.tasks.length+' 条任务记录。恢复会补入缺失记录，保留已有记录。';
    $('restoreMode').hidden=$('previewFile').hidden=$('restore').hidden=false;
  }catch(error){$('importInfo').textContent=error.message}
};

$('hideMenu').onclick=()=>$('side').classList.remove('open');

  });

function clearWorkspace(){

  view=previousView='home';filterText='';$('lookup').value='';closeDetail();

function disconnect(){if(editing)clearTimeout(editing.timer);epoch++;branch='';config=null;records.clear();clearWorkspace();sessionStorage.removeItem(key);localStorage.removeItem(key);$('token').value='';status('连接 GitHub');render()}

async function connect(c,remember){if(!await finishEdit())return;busy=true;epoch++;lockControls();records.clear();branch='';config=c;try{await verifyPrivate();records=await loadRecords();localStorage.setItem(key+':repo',c.repo);sessionStorage.removeItem(key);localStorage.removeItem(key);(remember?localStorage:sessionStorage).setItem(key,JSON.stringify(c));$('token').value='';$('setupError').textContent='';$('setup').close();clearWorkspace();render();status('已同步 · 刷新')}catch(e){disconnect();if(!$('setup').open)$('setup').showModal();$('setupError').textContent=e.message}finally{busy=false;lockControls()}if(config&&resumeNewList){resumeNewList=false;await newList()}}
$('connect').onsubmit=e=>{e.preventDefault();const repo=$('repo').value.trim(),token=$('token').value.trim();if(!/^[a-z\d-]+\/[\w.-]+$/i.test(repo)||!token){$('setupError').textContent='请填写用户名/仓库名及令牌。';return}connect({repo,token},$('remember').checked)};
render();let saved;try{saved=JSON.parse(sessionStorage.getItem(key)||localStorage.getItem(key)||'null')}catch{}if(saved)connect(saved,!!localStorage.getItem(key));else status('连接 GitHub');setInterval(()=>{if(!document.hidden)refresh()},30000);window.addEventListener('focus',refresh);
</script></html>
