<script>
'use strict';

const key='zhuri:'+location.pathname;let pendingAdd=null;let config=null, branch='', records=new Map(),view='day',editing=null,busy=false,refreshing=false,epoch=0;

const listTitle=id=>records.get(listKey(id))?.data.name||'任务';

const glyphs={day:'M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M19 5l-1.4 1.4M6.4 17.6L5 19M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0',star:'m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3-5.7-3-5.7 3 1.1-6.3L2.8 9.7l6.4-.9z',plan:'M4 6h16v15H4z M4 10h16M8 3v5m8-5v5',all:'M5 5h14v15H5z M9 9h6m-6 4h6m-6 4h4',inbox:'M3 11l3-7h12l3 7v8H3z M3 12h5l2 3h4l2-3h5',list:'M4 7h16M4 12h16M4 17h11'};
function nav(container,id,label){

let filterText='', previousView='day', showingPicks=false, undoTimer;
let editorQueue=Promise.resolve();
function squareTick(){
  const mark=el('span');mark.className='mark';mark.setAttribute('aria-hidden','true');return mark;
}
function iconToggle(label,active,kind,act){
  const btn=button('',act);btn.className='toggle '+kind;btn.setAttribute('aria-label',label);
  btn.setAttribute('aria-pressed',String(active));btn.title=label;
  const symbol=el('span',kind==='star'?(active?'★':'☆'):(active?'✓':''));symbol.setAttribute('aria-hidden','true');btn.append(symbol);return btn;

function dates(offset=0){
  const d=new Date();d.setDate(d.getDate()+offset);
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function dueName(d){return d===today()?'今天':d===dates(1)?'明天':d}
function inView(t,id){
  if(t.deleted)return false;
  if(id==='search'){const q=filterText.trim().toLocaleLowerCase();return q&&[t.title,t.note,listTitle(t.list),...t.steps.map(s=>s.title)].some(x=>x.toLocaleLowerCase().includes(q))}
  return id==='all'||id==='day'&&t.day===today()||id==='star'&&t.star||id==='plan'&&!!t.due||id==='inbox'&&!t.list||id==='list:'+t.list;
}
function suggestions(tasks){
  const todayKey=today();
  const rank=t=>t.due&&t.due<=todayKey?0:t.day&&t.day<todayKey?1:t.star?2:3;
  return tasks.filter(t=>!t.deleted&&!t.done&&t.day!==todayKey).sort((a,b)=>rank(a)-rank(b)||b.created-a.created);

function closeDetail(){
  editing=null;showingPicks=false;$('detail').replaceChildren();$('detail').hidden=true;
}

}
function notifyAction(message,undo){
  clearTimeout(undoTimer);const bar=$('notice');bar.replaceChildren(el('span',message));
  if(undo)bar.append(button('撤销',async()=>{bar.hidden=true;await undo()}));
  bar.hidden=false;undoTimer=setTimeout(()=>bar.hidden=true,8000);
}
async function updateTask(id,patch,undoLabel){
  if(!await finishEdit())return;
  const key=taskKey(id),current=records.get(key);
  if(!current)return;
  const old=Object.fromEntries(Object.keys(patch).map(k=>[k,current.data[k]]));
  await change(async()=>{
    await storeFile(key,{...current.data,...patch},current.sha);
    if(editing?.id===id){if(patch.deleted)closeDetail();else mountEditor(records.get(key))}
    if(undoLabel)notifyAction(undoLabel,async()=>{
      const now=records.get(key);
      if(!now||Object.keys(patch).some(k=>now.data[k]!==patch[k])){notifyAction('任务状态已改变');return}
      await updateTask(id,old);
    });
  });
}
function taskMenu(t,anchor){
  const menu=$('rowMenu');menu.replaceChildren();
  const chooseAction=(name,patch,label)=>menu.append(button(name,()=>{menu.close();updateTask(t.id,patch,label)}));
  chooseAction(t.day===today()?'移出我的一天':'加入我的一天',{day:t.day===today()?'':today()});
  chooseAction(t.star?'取消重要':'标为重要',{star:!t.star});
  chooseAction('今天到期',{due:today()});chooseAction('明天到期',{due:dates(1)});
  const label=el('label','移动到清单'),select=el('select');select.add(new Option('任务',''));
  entries('lists').forEach(l=>select.add(new Option(l.name,l.id)));select.value=t.list;
  select.onchange=()=>{menu.close();updateTask(t.id,{list:select.value},'已移动任务')};label.append(select);menu.append(label);
  menu.append(button('关闭',()=>menu.close()));menu.showModal();
  const x=Math.max(8,Math.min(innerWidth-menu.offsetWidth-8,anchor.x)),y=Math.max(8,Math.min(innerHeight-menu.offsetHeight-8,anchor.y));
  menu.style.left=x+'px';menu.style.top=y+'px';
}
function row(t){

const backupFormat = 'to-doo-backup';
const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function makeBackup(map) {
  const pick = prefix => [...map].filter(([path]) => path.startsWith(prefix)).map(([, record]) => record.data);
  return {format:backupFormat, version:1, exportedAt:new Date().toISOString(),
    fields:{lists:'Each list has an id and name. Empty lists are retained.',
      tasks:'list references lists.id. An empty list is the default inbox. day and due are local YYYY-MM-DD dates. created is Unix milliseconds. done, star, deleted and steps[].done are booleans.',
      restore:'Write lists and tasks as UTF-8 JSON in lists/{id}.json and tasks/{id}.json in an initialized private data repo. Retain IDs and list links. Independent programs can read the arrays directly.'},
    lists:pick('lists/'), tasks:pick('tasks/')};
}
function readBackup(data) {
  if(data?.format!==backupFormat || data.version!==1 || !Array.isArray(data.lists) || !Array.isArray(data.tasks)) throw Error('请选择 To Doo 的第 1 版 JSON 完整备份。');
  const map=new Map(), text=s=>typeof s==='string', date=s=>text(s)&&(!s||/^\d{4}-\d{2}-\d{2}$/.test(s));
  function add(path,record){if(map.has(path))throw Error('备份中有重复编号。');map.set(path,{data:record})}
  for(const l of data.lists){
    if(!l||!uuid.test(l.id)||!text(l.name)||!l.name.trim())throw Error('清单名称或编号无效。');
    add(listKey(l.id),l);
  }
  for(const t of data.tasks){
    if(!t||!uuid.test(t.id)||!text(t.title)||!t.title.trim()||!text(t.note)||!text(t.list)||!date(t.day)||!date(t.due)||
      !Number.isFinite(t.created)||[t.done,t.star,t.deleted].some(x=>typeof x!=='boolean')||
      !Array.isArray(t.steps)||t.steps.some(s=>!s||!text(s.title)||typeof s.done!=='boolean'))throw Error('任务或步骤格式不完整。');
    if(t.list&&!map.has(listKey(t.list)))throw Error('有任务引用了缺失的清单，未恢复。');
    add(taskKey(t.id),t);
  }
  return map;
}
function csvData(data) {
  const names=new Map(data.lists.map(l=>[l.id,l.name]));
  const header=['任务编号','清单编号','清单','任务','状态','重要','我的一天','截止日期','创建时间','备注','步骤（JSON）','已删除'];
  const cell=value=>{let s=String(value??'');if(/^[\s]*[=+@-]|^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};
  const rows=data.tasks.map(t=>[t.id,t.list,names.get(t.list)||'任务',t.title,t.done?'已完成':'待处理',t.star?'是':'否',t.day,t.due,new Date(t.created).toISOString(),t.note,JSON.stringify(t.steps),t.deleted?'是':'否']);
  return '\ufeff'+[header,...rows].map(r=>r.map(cell).join(',')).join('\r\n');

async function restoreMissing(){
  if(!incoming||archiveBusy)return;
  if(!config){archiveMessage('请先在同步设置中连接目标私有任务库，备份浏览无需登录。');return}
  archiveBusy=true;busy=true;epoch++;lockControls();$('restore').disabled=true;
  try{
    await verifyPrivate();
    const refPath='/git/ref/heads/'+branch.split('/').map(encodeURIComponent).join('/');
    const head=(await api(refPath)).object.sha, base=(await api('/git/commits/'+head)).tree.sha;
    const remote=await loadRecords(base), additions=[];let skipped=0,conflicts=0;
    const replace=$('replaceChanged').checked;
    for(const [path,{data}] of incoming){
      if(!remote.has(path))additions.push({path,mode:'100644',type:'blob',content:JSON.stringify(data,null,2)});
      else if(JSON.stringify(remote.get(path).data)===JSON.stringify(data))skipped++;
      else {conflicts++;if(replace)additions.push({path,mode:'100644',type:'blob',content:JSON.stringify(data,null,2)})}
    }
    const summary='新增 '+(additions.length-(replace?conflicts:0))+' 条，相同 '+skipped+' 条，差异 '+conflicts+' 条（'+(replace?'用备份版本替换':'保留云端版本')+'）。';
    if(!additions.length){archiveMessage(summary);return}
    if(!confirm('恢复到 '+config.repo+'？'+summary))return;
    const post=(path,body,method='POST')=>api(path,{method,body:JSON.stringify(body)});
    const tree=await post('/git/trees',{base_tree:base,tree:additions});
    const commit=await post('/git/commits',{message:'从 To Doo 完整备份恢复清单和任务',tree:tree.sha,parents:[head]});
    await post(refPath.replace('/git/ref/','/git/refs/'),{sha:commit.sha,force:false},'PATCH');
    archiveMessage('已恢复。'+summary);records=await loadRecords();render();status('已同步 · 刷新');
  }catch(e){archiveMessage('请刷新后核对目标仓库，再重试。'+e.message)}
  finally{busy=false;archiveBusy=false;lockControls();$('restore').disabled=false}
}

$('hideMenu').onclick=()=>$('side').classList.remove('open');
$('add').onsubmit=async e=>{e.preventDefault();const title=$('quick').value.trim();if(!title)return;if(!pendingAdd||pendingAdd.title!==title||pendingAdd.view!==view)pendingAdd={title,view,task:freshTask(title)};const t=pendingAdd.task;await change(async()=>{const known=records.get(taskKey(t.id));if(!known)await storeFile(taskKey(t.id),t);pendingAdd=null;$('quick').value='' });if(config)$('quick').focus()};
$('newList').onclick=()=>{if(!config){showSetup();return}$('listName').value='';$('listBox').showModal()};$('cancelList').onclick=()=>$('listBox').close();$('listForm').onsubmit=e=>{e.preventDefault();const name=$('listName').value.trim();if(!name)return;const l={id:crypto.randomUUID(),name};change(async()=>{await storeFile(listKey(l.id),l);$('listBox').close();choose('list:'+l.id)})};
$('suggest').onclick=openPicks;
$('lookup').oninput=async()=>{
  if(!await finishEdit())return;
  const q=$('lookup').value.trim();if(view!=='search')previousView=view;
  closeDetail();filterText=q;view=q?'search':previousView;render();
};
$('lookup').onkeydown=e=>{if(e.key==='Enter')$('side').classList.remove('open')};
document.addEventListener('keydown',async e=>{
  if(e.isComposing||document.querySelector('dialog[open]'))return;
  if(e.key==='Escape'){
    if(!await finishEdit())return;
    if(!$('detail').hidden){closeDetail();render()}
    else if(view==='search')choose(previousView);
    else $('side').classList.remove('open');
  }
});
window.addEventListener('beforeunload',e=>{if(editing?.dirty){e.preventDefault();e.returnValue=''}});
$('settings').onclick=showSetup;$('drawer').onclick=()=>$('side').classList.toggle('open');$('sync').onclick=()=>config&&branch?refresh():showSetup();$('dismiss').onclick=()=>$('setup').close();
function disconnect(){if(editing)clearTimeout(editing.timer);epoch++;branch='';config=null;pendingAdd=null;records.clear();closeDetail();view='day';$('quick').value='';sessionStorage.removeItem(key);localStorage.removeItem(key);$('token').value='';status('连接 GitHub');render()}
$('forget').onclick=()=>{disconnect();$('setup').close()};
async function connect(c,remember){busy=true;epoch++;lockControls();records.clear();branch='';config=c;try{await verifyPrivate();records=await loadRecords();localStorage.setItem(key+':repo',c.repo);sessionStorage.removeItem(key);localStorage.removeItem(key);(remember?localStorage:sessionStorage).setItem(key,JSON.stringify(c));$('token').value='';$('setupError').textContent='';$('setup').close();closeDetail();render();status('已同步 · 刷新')}catch(e){disconnect();if(!$('setup').open)$('setup').showModal();$('setupError').textContent=e.message}finally{busy=false;lockControls()}}
$('connect').onsubmit=e=>{e.preventDefault();const repo=$('repo').value.trim(),token=$('token').value.trim();if(!/^[a-z\d-]+\/[\w.-]+$/i.test(repo)||!token){$('setupError').textContent='请填写用户名/仓库名及令牌。';return}connect({repo,token},$('remember').checked)};
render();let saved;try{saved=JSON.parse(sessionStorage.getItem(key)||localStorage.getItem(key)||'null')}catch{}if(saved)connect(saved,!!localStorage.getItem(key));else status('连接 GitHub');setInterval(()=>{if(!document.hidden)refresh()},30000);window.addEventListener('focus',refresh);
</script></html>
